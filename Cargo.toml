[package]
name = "pronote_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
chrono = "0.4"
hex = "0.4"
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", features = ["cookies", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
